CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610_ALT=y

# Optional orientation settings (set as needed)
# Orientation is configured in pmw3610.dtsi with swap-xy;, invert-x;, invert-y;.

# Optional power saving and performance tuning
CONFIG_PMW3610_ALT_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_ALT_REST1_SAMPLE_TIME_MS=40
#CONFIG_PMW3610_ALT_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_ALT_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_ALT_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_ALT_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_ALT_REST3_DOWNSHIFT_TIME_MS=

CONFIG_PMW3610_ALT_SMART_ALGORITHM=y
# Accumulate deltas and report at most once per 12 ms to keep pointer and scroll
# traffic within the reliable BLE HID budget.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# If you have power-up issues, uncomment and tune this:
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
# Keep trying while a cold PMW3610 rail finishes settling instead of permanently
# disabling the sensor after its first failed product-ID/self-test read.
CONFIG_PMW3610_ALT_INIT_RETRY_COUNT=150
CONFIG_PMW3610_ALT_INIT_RETRY_DELAY_MS=4000
